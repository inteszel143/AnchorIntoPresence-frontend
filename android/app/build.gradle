plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"

}
// Keep upload credentials in the ignored android/key.properties file.
def uploadKeyProperties = new Properties()
def uploadKeyPropertiesFile = rootProject.file("key.properties")
if (uploadKeyPropertiesFile.exists()) {
    uploadKeyPropertiesFile.withInputStream { uploadKeyProperties.load(it) }
}

dependencies {
    implementation(platform("com.google.firebase:firebase-bom:33.15.0"))
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'com.google.android.gms:play-services-auth:20.6.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.firebase:firebase-messaging:23.1.1'
    // Google Play Billing 8+ is supplied by in_app_purchase_android.
}


android {
    namespace = "com.mediation.mindfullyevolve.mindfully_evolve_app"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
       applicationId = "com.mediation.mindfullyevolve.mindfully_evolve_app"
        /*applicationId = "com.mindsull.mindfullyevolveapp"*/
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (uploadKeyPropertiesFile.exists()) {
                keyAlias = uploadKeyProperties["keyAlias"]
                keyPassword = uploadKeyProperties["keyPassword"]
                storeFile = rootProject.file(uploadKeyProperties["storeFile"])
                storePassword = uploadKeyProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // Without upload credentials, produce an unsigned bundle only.
            signingConfig = uploadKeyPropertiesFile.exists() ? signingConfigs.release : null
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

}

flutter {
    source = "../.."
}
apply plugin: 'com.google.gms.google-services'

